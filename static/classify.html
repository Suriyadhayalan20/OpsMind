<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpsMind Ticket Classifier</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#2f6fed; --border:#e3e6eb;
            --urgent:#d93025; --high:#e8710a; --medium:#c99a00; --low:#188038; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151b; --card:#1b1f27; --text:#e7e9ee; --muted:#9aa3b2; --accent:#5b8cff; --border:#2c323d;
              --urgent:#ff6b5e; --high:#ffa24d; --medium:#ffd24d; --low:#5fd38a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; gap:14px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    h1 { font-size: 1.3rem; margin:0; }
    a { color: var(--accent); }
    select, textarea { width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font: inherit; }
    select { width:auto; }
    textarea { min-height: 120px; resize: vertical; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    .chip { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:0.85rem; }
    button.go { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; align-self:flex-start; }
    button:disabled { opacity:0.5; cursor:default; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; }
    .label { color:var(--muted); font-size:0.8rem; margin-bottom:4px; }
    .value { font-weight:600; font-size:1.05rem; }
    .p-urgent { color:var(--urgent); } .p-high { color:var(--high); } .p-medium { color:var(--medium); } .p-low { color:var(--low); }
    .meta { color:var(--muted); font-size:0.8rem; margin-top:12px; }
    pre { background:var(--bg); padding:12px; border-radius:8px; overflow-x:auto; font-size:0.85rem; margin:12px 0 0; }
    .error { color:var(--urgent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🏷️ Ticket Classifier</h1>
      <a href="/">← Back to chat</a>
    </header>
    <p style="margin:0;color:var(--muted)">Paste a customer message. The AI sorts it into a fixed format.</p>
    <select id="industry" aria-label="Choose industry"></select>
    <div class="row" id="samples"></div>
    <textarea id="text" placeholder="Customer message..."></textarea>
    <button class="go" id="go">Classify</button>
    <div id="out"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const SAMPLES = {
    banking: ["My credit card was charged twice for the same shopping. Please refund one.",
              "I want to close my old savings account. What is the process?"],
    ecommerce: ["The mixer I got has a cracked jar. I want a new one.",
                "I forgot my password and the reset email never comes."],
    hr: ["Please share my Form 16, I need it for my tax filing this week.",
         "My manager has not approved my leave for 5 days. My trip is tomorrow!"],
    insurance: ["Your agent was very rude to my father. I want to complain.",
                "My premium payment failed but money was deducted from my bank."],
  };

  function showSamples() {
    $("samples").innerHTML = "";
    (SAMPLES[$("industry").value] || []).forEach(t => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = t;
      b.onclick = () => { $("text").value = t; };
      $("samples").appendChild(b);
    });
  }

  function field(label, value, cls = "") {
    return `<div><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`;
  }

  async function classify() {
    const text = $("text").value.trim();
    if (text.length < 3) return;
    $("go").disabled = true;
    $("out").innerHTML = `<div class="card">Thinking...</div>`;
    try {
      const res = await fetch("/api/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ industry_id: $("industry").value, text }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Bad input");
      const r = data.result;
      const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      $("out").innerHTML = `
        <div class="card">
          <div class="grid">
            ${field("Category", esc(r.category))}
            ${field("Priority", esc(r.priority), "p-" + r.priority)}
            ${field("Sentiment", esc(r.sentiment))}
            ${field("Needs a human?", r.needs_human ? "Yes 🙋" : "No")}
          </div>
          <div style="margin-top:12px">${field("Summary", esc(r.summary))}</div>
          <div class="meta">AI: ${esc(data.provider)} · tries: ${data.attempts} · time: ${data.latency_ms} ms</div>
          <pre>${esc(JSON.stringify(r, null, 2))}</pre>
        </div>`;
    } catch (err) {
      $("out").innerHTML = `<div class="card error">Error: ${err.message}</div>`;
    } finally {
      $("go").disabled = false;
    }
  }

  $("go").onclick = classify;
  $("industry").onchange = showSamples;
  fetch("/api/industries").then(r => r.json()).then(list => {
    list.forEach(i => {
      const o = document.createElement("option");
      o.value = i.id; o.textContent = i.icon + " " + i.name;
      $("industry").appendChild(o);
    });
    showSamples();
  });
</script>
</body>
</html>
